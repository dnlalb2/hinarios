<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hinários do Santo Daime offline — letras, cifras com transposição de tom, favoritos e partituras.">

  <!-- A cor da barra de status acompanha o tema do app (atualizada em runtime).
       O valor abaixo é o fallback: fundo do tema claro. -->
  <meta name="theme-color" content="#F6FAF6">

  <!-- Aplica o tema salvo ao theme-color antes do app carregar: sem isso a
       barra de status do PWA fica clara no boot do tema escuro. O app
       reaplica em runtime (theme_color.dart). O shared_preferences grava no
       localStorage com o prefixo 'flutter.' e valor JSON. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('flutter.hinario.tema') === 'true') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#101510');
        }
      } catch (e) {}
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hinário CSJ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hinário Cifrado Céu de São José</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
