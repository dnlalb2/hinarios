name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Build web (release)
        # --no-web-resources-cdn empacota o CanvasKit localmente — sem ele o
        # app carrega o motor de renderização de www.gstatic.com e fica em
        # tela branca quando offline (PWA).
        run: flutter build web --release --no-web-resources-cdn --base-href=/${{ github.event.repository.name }}/

      - name: Corrigir service worker (deploy em subpasta)
        # O SW gerado calcula a chave pelo caminho absoluto da URL, mas o
        # RESOURCES usa chaves relativas ao scope; sem este strip o lookup
        # falha e o PWA nao abre offline.
        run: python3 tool/patch_service_worker.py build/web/flutter_service_worker.js "${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
